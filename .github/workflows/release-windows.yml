name: Release — Windows package

# Builds the Windows onedir package (PyInstaller can only build for the OS it
# runs on) and attaches a zip to the GitHub release. Fires automatically when a
# release is published; also runnable by hand against an existing tag.
#
# --onedir (not --onefile): no ~6 s self-extract on every launch; ship as a zip
# so the folder (exe + _internal/) stays intact.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the Windows zip to (e.g. v3.7.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build + runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build Windows onedir package
        run: |
          # shiboken6 must be collected separately; PySide6's import-time DLL
          # probe raises ImportError: "...\shiboken6 does not exist" otherwise.
          pyinstaller --noconfirm --onedir --windowed --name DailyScheduler `
            --collect-all PySide6 `
            --collect-all shiboken6 `
            --hidden-import shiboken6 `
            --copy-metadata PySide6 `
            --copy-metadata shiboken6 `
            --add-data "LICENSE;." `
            app.py
          # Zip the whole folder (exe + _internal)
          Compress-Archive -Path dist\DailyScheduler `
            -DestinationPath dist\DailyScheduler-win64.zip -Force
          $hash = (Get-FileHash dist\DailyScheduler-win64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  DailyScheduler-win64.zip" | Set-Content -NoNewline dist\DailyScheduler-win64.zip.sha256
          Write-Host "SHA256: $hash"

      - name: Smoke-test package layout
        # --windowed freezes have no console; assert freeze layout is complete.
        # Missing shiboken6 is the classic "Failed to execute script 'app'" crash.
        run: |
          $root = "dist\DailyScheduler"
          $exe = Join-Path $root "DailyScheduler.exe"
          if (-not (Test-Path $exe)) { throw "DailyScheduler.exe missing after build" }
          $shibo = Get-ChildItem -Path $root -Recurse -Directory -Filter "shiboken6" -ErrorAction SilentlyContinue
          if (-not $shibo) {
            throw "shiboken6 package dir missing under $root — PySide6 will fail at import on Windows"
          }
          Write-Host "Built: $exe"
          Write-Host "shiboken6 at: $($shibo[0].FullName)"
          Get-ChildItem $root | Select-Object Name, Length

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$env:TAG" `
            dist\DailyScheduler-win64.zip `
            dist\DailyScheduler-win64.zip.sha256 `
            --clobber
