name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    name: Syntax & lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ruff + pyright
        run: pip install ruff pyright

      # Static checks only — no need to install the heavy GUI deps (PySide6),
      # since both tools analyse the source without importing it.
      - name: Syntax check
        run: python -m py_compile *.py

      - name: Lint (real-bug rules)
        run: ruff check *.py --select E9,F63,F7,F82

      # Types: project config in pyrightconfig.json (basic; Qt enum noise suppressed).
      # Install runtime deps so PySide6/google stubs resolve; analysis does not import for GUI.
      - name: Install deps for type resolution
        run: pip install -r requirements.txt

      - name: Type check (pyright)
        run: pyright

  # Pure planning logic (v4.3.0). core.py has been Qt-free since the v4.2.0 split,
  # so this needs no PySide6 and no display — it finishes in well under a second and
  # gives fast feedback on the layer that carries the real bugs. Deliberately does
  # NOT install requirements.txt: if core ever imports Qt, this job fails.
  core-tests:
    name: Core logic (no Qt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run Qt-free core suite
        run: python tests/test_core_pure.py

  # Offscreen Qt suite (v4.0). Synthetic data only — never real schedule files.
  tests:
    name: Offscreen tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install deps + system libs for offscreen Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libgl1
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Qt offscreen suites often print RESULT: PASS / N/N passed, then exit
          # non-zero at interpreter teardown (QThread still running). Treat a clear
          # success line as pass; only fail on [FAIL] or missing success marker.
          failed=0
          for t in tests/test_*.py; do
            echo "=== $t ==="
            set +e
            out=$(python "$t" 2>&1)
            ec=$?
            set -e
            echo "$out"
            if echo "$out" | grep -q '\[FAIL\]'; then
              echo "→ FAIL assertions in $t"
              failed=1
            elif echo "$out" | grep -qE 'RESULT: PASS|[0-9]+/[0-9]+ passed'; then
              if [ "$ec" -ne 0 ]; then
                echo "→ OK $t (exit $ec ignored — Qt teardown noise)"
              fi
            else
              echo "→ FAIL $t (exit $ec, no success marker)"
              failed=1
            fi
          done
          exit $failed
