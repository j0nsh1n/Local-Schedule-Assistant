name: Release — Linux binary

# Builds the Linux onedir package (PyInstaller can only build for the OS it runs
# on) and attaches a zip to the GitHub release. Fires automatically when a
# release is published; also runnable by hand against an existing tag.
#
# --onedir (not --onefile): no ~6 s self-extract on every launch; ship as a zip
# so the folder (binary + _internal/) stays intact. Built on ubuntu-22.04 for
# older glibc → runs on Ubuntu 22.04+/Debian 12+ (a Nobara-built binary would
# demand Fedora's newer glibc).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the Linux binary to (e.g. v3.7.0)"
        required: true

permissions:
  contents: write        # needed to upload a release asset

jobs:
  linux:
    # 22.04 links an older glibc than 24.04, so the binary runs on more distros.
    runs-on: ubuntu-22.04
    steps:
      # Build the exact tagged commit on BOTH paths (on a release event the tag
      # ref resolves the same commit; on manual dispatch this avoids building
      # default-branch HEAD and attaching a mismatched binary to the tag).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build + runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build Linux onedir package
        run: |
          pyinstaller --noconfirm --onedir --name DailyScheduler \
            --collect-all PySide6 \
            --add-data "LICENSE:." \
            app.py
          chmod +x dist/DailyScheduler/DailyScheduler
          # Folder name matches the historical asset basename so downloaders
          # still recognise it; the zip is what GitHub hosts.
          cd dist
          mv DailyScheduler DailyScheduler-linux-x86_64
          zip -r DailyScheduler-linux-x86_64.zip DailyScheduler-linux-x86_64
          sha256sum DailyScheduler-linux-x86_64.zip | tee DailyScheduler-linux-x86_64.zip.sha256

      - name: Smoke-test package
        run: |
          # Bare runners lack libEGL/Qt display deps; a full --version launch
          # fails for environment reasons even when the freeze is fine. Assert
          # the binary exists, is executable, and is a non-trivial size.
          bin=dist/DailyScheduler-linux-x86_64/DailyScheduler
          test -x "$bin"
          size=$(stat -c%s "$bin")
          echo "Built $bin ($size bytes)"
          test "$size" -gt 1000000

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$TAG" \
            dist/DailyScheduler-linux-x86_64.zip \
            dist/DailyScheduler-linux-x86_64.zip.sha256 \
            --clobber
